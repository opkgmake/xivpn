plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'cn.gov.xivpn2'
    compileSdk 36

    defaultConfig {
        applicationId "io.github.exclude0122.xivpn"
        minSdk 28
        targetSdk 35
        versionCode 37
        versionName "1.7.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }


    def releaseKeystoreFile = file("../sign/keystore.jks")
    def releaseStorePassword = System.getenv("RELEASE_KEYSTORE_PASSWORD")?.trim()
    def releaseKeyAlias = System.getenv("RELEASE_KEYSTORE_ALIAS")?.trim()
    def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD")?.trim()
    def hasReleaseSigning = releaseKeystoreFile.exists() &&
            [releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

    signingConfigs {
        githubaction {
            if (hasReleaseSigning) {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            } else {
                def fallbackKeystore = project.layout.buildDirectory.file("githubaction-debug.keystore").get().asFile
                if (!fallbackKeystore.exists()) {
                    fallbackKeystore.parentFile?.mkdirs()
                    try {
                        project.logger.lifecycle("Generating fallback debug keystore at ${fallbackKeystore}")
                        project.exec {
                            commandLine "keytool",
                                    "-genkeypair",
                                    "-alias", "androiddebugkey",
                                    "-keypass", "android",
                                    "-keystore", fallbackKeystore.absolutePath,
                                    "-storepass", "android",
                                    "-dname", "CN=Android Debug,O=Android,C=US",
                                    "-keyalg", "RSA",
                                    "-keysize", "2048",
                                    "-validity", "10000"
                        }
                    } catch (Exception generateKeystoreError) {
                        throw new GradleException("Failed to generate fallback debug keystore", generateKeystoreError)
                    }
                }

                storeFile fallbackKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/*.so']
            useLegacyPackaging true
        }
    }


    buildFeatures {
        buildConfig true
    }

    flavorDimensions += "version"
    productFlavors {
        universal {
            signingConfig signingConfigs.githubaction
            ndk {
                abiFilters "arm64-v8a", "x86_64", "armabi-v7a"
            }
            versionCode = defaultConfig.versionCode * 10 + 1
        }

        x86_64 {
            signingConfig signingConfigs.githubaction
            ndk {
                abiFilters "x86_64"
            }
            versionCode = defaultConfig.versionCode * 10 + 2
        }

        arm64_v8a {
            signingConfig signingConfigs.githubaction
            ndk {
                abiFilters "arm64-v8a"
            }
            versionCode = defaultConfig.versionCode * 10 + 3
        }

        armabi_v7a {
            signingConfig signingConfigs.githubaction
            ndk {
                abiFilters "armeabi-v7a"
            }
            versionCode = defaultConfig.versionCode * 10 + 4
        }


    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
    lint {
        showAll true
    }

    androidResources {
        generateLocaleConfig true
    }


}

dependencies {
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler
    implementation libs.google.guava
    implementation libs.gson
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.work.runtime
    implementation libs.okhttp
    implementation libs.preference
    implementation libs.commons.io
    implementation libs.recyclerview
    implementation libs.commons.collections4
}
